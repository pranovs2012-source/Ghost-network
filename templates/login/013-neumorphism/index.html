<!DOCTYPE html>
<html lang="en" data-mode="light" data-accent="indigo">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Hush — Sign in</title>
  <meta name="description" content="Neumorphism (soft UI) login template with passkey scan, strength ring, accent picker and dark mode.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Lexend:wght@300;400;500;600;700&amp;display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <!-- Appearance controls -->
  <aside class="prefs" aria-label="Appearance">
    <div class="swatches" role="radiogroup" aria-label="Accent color">
      <button class="swatch" type="button" role="radio" data-accent="indigo" aria-label="Indigo" aria-checked="true"></button>
      <button class="swatch" type="button" role="radio" data-accent="teal" aria-label="Teal" aria-checked="false" tabindex="-1"></button>
      <button class="swatch" type="button" role="radio" data-accent="rose" aria-label="Rose" aria-checked="false" tabindex="-1"></button>
      <button class="swatch" type="button" role="radio" data-accent="amber" aria-label="Amber" aria-checked="false" tabindex="-1"></button>
    </div>
    <button class="soft-btn soft-btn--icon" type="button" id="mode-toggle" aria-pressed="false">
      <svg class="icon-moon" viewBox="0 0 24 24" aria-hidden="true"><path d="M20 14.5A8 8 0 0 1 9.5 4 8 8 0 1 0 20 14.5z"/></svg>
      <svg class="icon-sun" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="4.5"/><path d="M12 2v2M12 20v2M2 12h2M20 12h2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
      <span class="visually-hidden" id="mode-label">Dark mode</span>
    </button>
  </aside>

  <main class="shell">
    <div class="card">
      <div class="emblem" aria-hidden="true">
        <svg viewBox="0 0 40 40"><path d="M10 26c4 4 16 4 20 0M13 15h0M27 15h0" stroke="currentColor" stroke-width="3.5" stroke-linecap="round" fill="none"/></svg>
      </div>
      <p class="brand">hush</p>

      <!-- Segmented switch between sign in and sign up -->
      <nav class="segment" aria-label="Account">
        <button type="button" class="segment__btn" data-goto="login" data-seg="login">Sign in</button>
        <button type="button" class="segment__btn" data-goto="signup" data-seg="signup">Sign up</button>
        <span class="segment__thumb" aria-hidden="true"></span>
      </nav>

      <!-- SIGN IN -->
      <section class="screen is-active" id="login" data-screen aria-labelledby="login-title">
        <h1 class="title" id="login-title" tabindex="-1">Welcome back</h1>
        <p class="subtitle">Calm in, calm out.</p>
        <form class="form" id="login-form" novalidate>
          <div class="field">
            <label for="login-email">Email</label>
            <div class="well">
              <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 6h16v12H4zM4 7l8 6 8-6"/></svg>
              <input id="login-email" name="email" type="email" autocomplete="email" placeholder="you@calm.app" required aria-describedby="login-email-error">
            </div>
            <p class="field__error" id="login-email-error" aria-live="polite"></p>
          </div>
          <div class="field">
            <label for="login-password">Password</label>
            <div class="well">
              <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="5" y="10" width="14" height="10" rx="2"/><path d="M8 10V7a4 4 0 0 1 8 0v3"/></svg>
              <input id="login-password" name="password" type="password" autocomplete="current-password" placeholder="Your password" required minlength="8" aria-describedby="login-password-error">
              <button class="reveal" type="button" data-toggle-password="login-password" aria-pressed="false" aria-label="Show password">
                <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7S2 12 2 12z"/><circle cx="12" cy="12" r="3"/></svg>
              </button>
            </div>
            <p class="field__error" id="login-password-error" aria-live="polite"></p>
          </div>
          <div class="row">
            <label class="switch"><input type="checkbox" name="remember" role="switch" checked><span class="switch__track" aria-hidden="true"></span>Remember me</label>
            <button class="link" type="button" data-goto="forgot">Forgot password?</button>
          </div>
          <button class="soft-btn soft-btn--primary" type="submit"><span class="btn__label">Sign in</span><span class="spinner" aria-hidden="true"></span></button>
        </form>

        <div class="or"><span>or</span></div>
        <button class="passkey" type="button" id="passkey">
          <span class="passkey__pad" aria-hidden="true">
            <svg viewBox="0 0 48 48"><path d="M16 38c-2-4-3-8-3-13a11 11 0 0 1 22 0M24 22a3 3 0 0 1 3 3c0 6 1 9 3 12M20 40c-2-4-3-9-3-15a7 7 0 0 1 14 0M24 25c0 5 1 9 3 13M12 33c-1-3-1-5-1-8a13 13 0 0 1 20-11M37 30c0-2 0-3 0-5"/></svg>
            <span class="passkey__scan"></span>
          </span>
          <span class="passkey__text"><span class="passkey__title">Use a passkey</span><span class="passkey__sub" id="passkey-sub">Face, fingerprint or device PIN</span></span>
        </button>
        <p class="note">New here? <button class="link" type="button" data-goto="signup">Create an account</button></p>
      </section>

      <!-- SIGN UP -->
      <section class="screen" id="signup" data-screen aria-labelledby="signup-title" hidden>
        <h1 class="title" id="signup-title" tabindex="-1">Create your space</h1>
        <p class="subtitle">One quiet place for everything.</p>
        <form class="form" id="signup-form" novalidate>
          <div class="field">
            <label for="signup-name">Name</label>
            <div class="well">
              <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="8" r="4"/><path d="M4 20c1.5-4 4.5-6 8-6s6.5 2 8 6"/></svg>
              <input id="signup-name" name="name" type="text" autocomplete="name" placeholder="Your name" required aria-describedby="signup-name-error">
            </div>
            <p class="field__error" id="signup-name-error" aria-live="polite"></p>
          </div>
          <div class="field">
            <label for="signup-email">Email</label>
            <div class="well">
              <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 6h16v12H4zM4 7l8 6 8-6"/></svg>
              <input id="signup-email" name="email" type="email" autocomplete="email" placeholder="you@calm.app" required aria-describedby="signup-email-error">
            </div>
            <p class="field__error" id="signup-email-error" aria-live="polite"></p>
          </div>
          <div class="field">
            <label for="signup-password">Password</label>
            <div class="pw-row">
              <div class="well">
                <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="5" y="10" width="14" height="10" rx="2"/><path d="M8 10V7a4 4 0 0 1 8 0v3"/></svg>
                <input id="signup-password" name="password" type="password" autocomplete="new-password" placeholder="8+ characters" required minlength="8" aria-describedby="ring-text signup-password-error">
              </div>
              <div class="ring" aria-hidden="true">
                <svg viewBox="0 0 44 44"><circle class="ring__track" cx="22" cy="22" r="18"/><circle class="ring__fill" id="ring-fill" cx="22" cy="22" r="18"/></svg>
                <span class="ring__num" id="ring-num">0</span>
              </div>
            </div>
            <p class="hint" id="ring-text" aria-live="polite">Strength: not set</p>
            <p class="field__error" id="signup-password-error" aria-live="polite"></p>
          </div>
          <label class="switch"><input type="checkbox" name="terms" role="switch" required aria-describedby="signup-terms-error"><span class="switch__track" aria-hidden="true"></span><span>I agree to the <a class="link" href="#terms">terms</a></span></label>
          <p class="field__error" id="signup-terms-error" aria-live="polite"></p>
          <button class="soft-btn soft-btn--primary" type="submit"><span class="btn__label">Create account</span><span class="spinner" aria-hidden="true"></span></button>
        </form>
        <p class="note">Already have an account? <button class="link" type="button" data-goto="login">Sign in</button></p>
      </section>

      <!-- FORGOT -->
      <section class="screen" id="forgot" data-screen aria-labelledby="forgot-title" hidden>
        <h1 class="title" id="forgot-title" tabindex="-1">Reset password</h1>
        <p class="subtitle">We’ll email you a quiet little link.</p>
        <form class="form" id="forgot-form" novalidate>
          <div class="field">
            <label for="forgot-email">Email</label>
            <div class="well">
              <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 6h16v12H4zM4 7l8 6 8-6"/></svg>
              <input id="forgot-email" name="email" type="email" autocomplete="email" placeholder="you@calm.app" required aria-describedby="forgot-email-error">
            </div>
            <p class="field__error" id="forgot-email-error" aria-live="polite"></p>
          </div>
          <button class="soft-btn soft-btn--primary" type="submit"><span class="btn__label">Send link</span><span class="spinner" aria-hidden="true"></span></button>
        </form>
        <p class="note"><button class="link" type="button" data-goto="login">Back to sign in</button></p>
      </section>

      <!-- SENT -->
      <section class="screen screen--center" id="sent" data-screen aria-labelledby="sent-title" hidden>
        <div class="pressed-check" aria-hidden="true"><svg viewBox="0 0 48 48"><path d="M14 25l7 7 14-15"/></svg></div>
        <h1 class="title" id="sent-title" tabindex="-1">Check your inbox</h1>
        <p class="subtitle">A reset link is on its way to <strong class="sent-email">your email</strong>.</p>
        <button class="soft-btn" type="button" data-goto="login">Back to sign in</button>
        <p class="note"><button class="link" type="button" id="resend" disabled>Resend in <span id="resend-timer">30</span>s</button></p>
      </section>
    </div>
  </main>

  <div class="toast" role="status" aria-live="polite"></div>
  <script src="script.js"></script>
</body>
</html>
